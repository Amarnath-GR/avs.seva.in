functionsDirectory = "/root/projects/avs.seva.in/netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"

[build]
publish = "/root/projects/avs.seva.in/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/root/projects/avs.seva.in/netlify/functions"

[build.environment]
NODE_VERSION = "22"
SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_LOG_SALT,WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]

[[plugins]]
origin = "ui"
package = "@21yunbox/netlify-plugin-21yunbox-deploy-to-china-cdn"

[plugins.inputs]

[[plugins]]
origin = "ui"
package = "@algolia/netlify-plugin-crawler"

[plugins.inputs]

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "http://avsseva.in/*"
to = "https://avsseva.in/:splat"
status = 301.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]