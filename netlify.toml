[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These values are consumed only by the server-side WhatsApp Function and
  # cannot enter the Vite client bundle. Keep secrets scanning enabled while
  # excluding the two server-only keys reported by the scanner.
  SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_LOG_SALT,WHATSAPP_VERIFY_TOKEN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
