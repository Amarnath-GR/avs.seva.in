[build]
  command = "npm run build"
  publish = "dist"
  # These are server-only Netlify Function variables, read via process.env in
  # netlify/functions/whatsapp-webhook.mjs. Their VALUES are never in the repo
  # and never reach the client bundle (nothing here is VITE_-prefixed), but
  # Netlify's secrets scanner flags the variable names and fails the build.
  # This allowlists the two keys. The scanner stays fully enabled for
  # everything else - a real credential in source will still fail the build.
  SECRETS_SCAN_OMIT_KEYS = ["WHATSAPP_LOG_SALT", "WHATSAPP_VERIFY_TOKEN", "WHATSAPP_APP_SECRET"]

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
